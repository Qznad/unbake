name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          Copy-Item target/release/unbake.exe unbake.exe
          $hash = (Get-FileHash unbake.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path unbake.exe.sha256 -Value "$hash  unbake.exe" -Encoding ascii -NoNewline
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            unbake.exe
            unbake.exe.sha256
          generate_release_notes: true
